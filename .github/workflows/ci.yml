name: Campus CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 阶段 1：构建并测试后端 (Spring Boot)
  backend-build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and Test with Maven
      run: |
        cd campus_backend
        mvn clean test -B
      
    - name: Build Docker Image
      run: |
        cd campus_backend
        docker build -t campus-backend:test .

  # 阶段 2：构建前端 (Vue)
  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './campus_front/package-lock.json'

    - name: Install Dependencies
      run: |
        cd campus_front
        npm ci

    - name: Build Frontend
      run: |
        cd campus_front
        npm run build